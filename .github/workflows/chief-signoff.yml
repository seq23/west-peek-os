name: Chief sign-off

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: chief-signoff-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  inspect-metadata:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Inspect PR metadata and set the head status
        env:
          GH_TOKEN: ${{ github.token }}
          WP_CHIEF_FORK: ${{ vars.WP_CHIEF_FORK }}
          WP_CHIEF_APPROVAL_PUBLIC_KEY: ${{ vars.WP_CHIEF_APPROVAL_PUBLIC_KEY }}
        run: node scripts/chiefs/chief-signoff.mjs

# West Peek OS — continuous validation.
#
# Runs the repo's real gate (typecheck, unit/integration tests, every static validator, the
# client build, and the Playwright journeys) on every push and pull request against `main`.
#
# Deliberately NOT in this workflow: a deploy step. BACKLOG.md records the decision already made
# here — Cloudflare Workers Builds was connected on 14 Aug 2026 and switched off on 18 Aug 2026,
# on purpose, because auto-deploy-on-push cannot run the safe migrate-then-deploy sequence
# (`npm run deploy:production`) without a long-lived Cloudflare API token with D1 write access
# living in the CI environment — real blast radius, for a firm that deploys from one laptop.
# GitHub is source history and a validation gate. It is not the deploy mechanism.
#
# Also NOT here: `validate:value-shapes`. It queries production D1 directly
# (`wrangler d1 execute --remote`) and needs the same production credentials this workflow
# deliberately does not hold. It stays a pre-deploy, operator-run check (docs/DEPLOYING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and boundary validators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npx vitest run --no-file-parallelism

      # The governance boundary scans are part of the gate, not optional extras: they are what
      # keep authority, the AI boundary, cross-repo isolation, brand, design tokens, CSS
      # coverage, and SQL-against-schema honest. Each has its own self-test — a validator that
      # cannot demonstrate it still catches what it exists to catch does not run here.
      - name: One topic a month, several angles inside it
        run: npm run validate:angles

      - name: Authority boundary
        run: npm run validate:authority

      - name: AI boundary
        run: npm run validate:ai-boundary

      - name: Network boundary
        run: npm run validate:network-boundary

      - name: Brand system
        run: npm run validate:brand

      - name: Design tokens
        run: npm run validate:design-tokens

      - name: CSS class coverage
        run: npm run validate:css-classes

      # THE COMPLEMENT OF THE SCAN ABOVE. That one asks whether every class the page applies is
      # defined; this asks whether a defined heading rule reaches anything. `.home-section-head h2`
      # was valid CSS aimed at a tag none of its 34 call sites emit, so every section heading in the
      # product rendered at browser default — green build, no failing test, and an operator saying
      # "the headings have no visual weight". It found two more of the same on the day it was written.
      - name: A heading-scale rule reaches a heading
        run: npm run validate:heading-scale

      - name: Every var(--token) resolves
        run: npm run validate:css-variables

      - name: SQL against schema
        run: npm run validate:sql

      # A lane that receives a deck a few times a month is not polled 96 times a day, and where its
      # hour was chosen on her clock it carries her zone — a bare UTC hour drifts every November.
      - name: A rare lane is checked once a day, on her clock
        run: npm run validate:deck-cadence

      # "decks arriving is not broken. we just dont get decks every day." No check may ask for her
      # attention because nothing happened; a board that fires on normal gets skimmed, and the check
      # beside it that morning was genuinely failing.
      - name: Quiet is not a fault
        run: npm run validate:quiet-is-not-a-fault

      # The LP deck cannot become current without a human deciding. On 9 Sep 2026 an upload
      # published itself and displaced the deck the firm sends; migration 0155 is the cleanup.
      - name: A deck becomes current only by human decision
        run: npm run validate:deck-decision

      # A West Peek employee signs from joinwestpeek.com — never from westpeek.ventures, which is
      # the LP-facing partner identity, and never from sequoiataylor.com, which is Boss OS.
      - name: Employees send from West Peek's own domain
        run: npm run validate:employee-sender

      # os@joinwestpeek.com is publicly addressable, and an authenticated partner's mail can now
      # assign work. A From header is a string the sender chooses, so this proves no path turns a
      # message into an assignment without SPF, DKIM, DMARC and the two-address allow-list.
      - name: An emailed assignment needs an authenticated partner
        run: npm run validate:mail-authority

      # Every email an employee sends a partner leaves through services/execEmail.ts, which lays it
      # out (TL;DR, labelled bullets, details under a rule, footer) and lints it before any
      # transport sees it. A service calling a transport itself fails here.
      - name: Every partner email takes the one door
        run: npm run validate:partner-email

      # A block is a question addressed to the owner. Every one has to say what was being done, what
      # stopped it in a sentence with no machinery in it, what would clear it and who can clear it —
      # and offer a button. A service that blocks a card its own way fails here.
      - name: A block is something she can clear herself
        run: npm run validate:blocks

      # A CARD THAT STOPS ON A FAULT SAYS WHAT REFUSED IT. On 17 Sep 2026 a card failed three times
      # in fourteen minutes because one lane's account had run out of credit, and the Work page said
      # "Open · queued — picked up within 5 min" throughout. The reason existed only as
      # `provider_failure:provider_http_400` on a row in D1 and the fix was editing that database.
      # This fails the build if an adapter throws a status code away, if a real failure stops
      # producing a block a partner can read, if a lane she stood down can still be picked, if a
      # door does not put the card back in the queue, or if the page stops telling a stopped card
      # from a waiting one.
      - name: A stopped card says why, and she can fix it from the card
        run: npm run validate:stopped-cards

      # BOTH PARTNERS' MORNING BRIEFS, 18 Sep 2026. A 60s provider deadline landed on a call this
      # repo says takes ~3 min, so every frontier attempt aborted; the router failed over to Workers
      # AI, whose adapter sent no max_tokens, so the platform applied its own default of 256; every
      # one of the eight runs returned exactly 256 tokens, cut off mid-sentence; the quality gate
      # correctly rejected all eight for the citations and sections the model never got to write;
      # and Home rendered a header, a button, "300 items → 283 events → 30 considered" and nothing
      # else. This fails if an adapter lets a provider's default decide how long a reply may be, if
      # the deadline is too short for the largest reply any caller asks for, or if a report that is
      # not a readable brief can reach her Home without saying so.
      - name: A brief that fails says so, and none is truncated by a ceiling nobody chose
        run: npm run validate:brief-arrives

      # AND THE OTHER HALF OF THAT MORNING. At 14:58 Scooter's row read FAILED/3 with a reason on it
      # and Sequoia's read GENERATING/3 with error_message empty: her write stage made both its
      # model calls and the isolate was evicted before the outcome was persisted, so nothing wrote
      # anything. `attempts` counts attempt STARTS and nothing counted ends, and the skip guard and
      # both done-queries each tested FAILED by hand — so a row mid-pipeline with the budget spent
      # matched none of them and was advanced, free, by every tick. This fails if any status/attempt
      # pairing can rest with a spent budget in a non-terminal status, if the three places disagree
      # about "finished", if nothing closes a stranded row before it is advanced again, or if the
      # sentence she is left with does not say what happened and what she can do.
      - name: A brief always ends stated, and never spends a budget it has not got
        run: npm run validate:brief-ends-stated

      # RUNNING OUT OF ATTEMPTS IS A TERMINAL STATE, AND IT HAS TO LOOK LIKE ONE. On 18 Sep 2026
      # "Draft event kit: October workshop with Kirx Diaz" sat at `state = OPEN, work_attempts = 3`
      # for fourteen hours. `claimNextCard` takes claimable cards UNDER the ceiling, so nothing could
      # pick it up; it was not BLOCKED, so none of the block machinery reached it — no reason, no
      # doors, no nag — and it read as ordinary open work while being the thing the owner most wanted
      # that day. The same shape appeared in `intelligence_report` the same morning, which is why
      # this scan is table-driven rather than written about one table. It fails the build if the
      # ceiling in SQL and the ceiling in TypeScript disagree, if either trigger goes missing, if the
      # settler stops covering a claimable state or a NULL lease, if the block stops carrying the
      # failure the row already holds, or if any writer puts a card back without an opinion about the
      # allowance.
      - name: Work that runs out of attempts stops, and says why
        run: npm run validate:spent-attempts

      # DAY 200, NOT DAY 1. Measured on 18 Sep against 531 finished cards: the board returned every
      # card the firm had ever made under LIMIT 500 and the page rendered the first fifty of them
      # under a heading that said 496 — 481 unreachable, silently, and an OPEN card older than the
      # cap would have fallen off the board entirely. Nothing failed. This fails if finished work is
      # ever truncated in the browser again, if the board stops carrying live states only, or if a
      # record control stops reaching the server.
      - name: The record scales to day 200
        run: npm run validate:record-scales

      # Nothing a partner types may reach no model. Every branch of the sweep's dispatch is read out
      # of the source, so the chain nobody remembers to wire is the one this fails on.
      - name: Everything she says reaches a thinking model
        run: npm run validate:instructions

      # ONE LEVER, NOT FOUR. `cost_mode` held four values answering three unrelated questions, and
      # 17 Sep 2026's near-miss came straight out of that: CHEAPO meant "spend less" and, because
      # the same column also answered "how good", it ignored preferredModel — which would have sent
      # all eight live-search calls to a model with no web access. That model does not error; it
      # answers from memory. The column still exists for the archive, so this fails the build if a
      # routing decision ever reads it again, and equally if the new lever stops being consulted.
      - name: How much money and how good are different decisions
        run: npm run validate:one-lever

      # A PREVIEW REACHES NOBODY. It does the real work — real searches, real model calls, the real
      # note — and exactly one address receives it. The rule lives at the send boundary rather than
      # in each feature, so this is what makes the NEXT transport somebody adds fail the build
      # instead of quietly emailing a founder during a rehearsal.
      - name: A preview reaches nobody but the partner who asked for it
        run: npm run validate:preview

      # AND THE OTHER HALF OF THE SAME BOUNDARY: a LIVE run reaches nobody outside the firm unless
      # she said yes to that exact message going to that exact person. Her rule, 17 Sep 2026:
      # "anything to anyone other than sequoia@ and scooter@ should be default preview." The sibling
      # scan above would still pass if the lane were deleted, which is why this is its own.
      - name: Nobody outside the firm is emailed without an approved preview
        run: npm run validate:preview-lane

      # AND THE CALLER-SIDE HALF OF THE SAME RULE. The boundary scan above guards the TRANSPORT and
      # says nothing about who reaches it. On 18 Sep 2026 `sendOrPreview` was called from exactly one
      # file: blogHelp, productions, requestReply and Parker's packets all went straight to
      # `sendPartnerEmail`. Every one of those addresses a partner, so the boundary was happy, every
      # validator was green, and `work_card.preview_first` — her "Show me first?" tick — did nothing
      # at all on four of the five employees. This fails the build if a send path is added that can
      # reach a transport without passing the lane, if an exemption goes stale, or if a caller
      # quietly stops passing her tick.
      - name: Every employee's finished work takes the lane
        run: npm run validate:employee-lane

      # The firm answers "is this one of the two partners?" in exactly one place. It answered in
      # four until 17 Sep 2026, and the cost was not drift — it was that a new feature needing the
      # join between an address and a firm_user id could ask none of them.
      - name: One central answer to who the partners are
        run: npm run validate:partners

      # A LANE THAT CANNOT SERVE MUST CHAIN, AND A NOTICE MUST NOT TAKE THE FIRM OFFLINE.
      #
      # Two of these four checks cannot be written as a test. An adapter added next year that throws
      # the bare HTTP status has silently opted its whole vendor out of the outage classifier — no
      # existing test would exercise it. And a notice added by a future migration containing an LP
      # marker phrase would, because notices are read into EVERY prompt and the classifier scans
      # prompt inputs, mark every run in the firm as LP material and refuse every free route. That
      # is not hypothetical: in the sister system the single word "commitment" in a notice did
      # exactly that.
      - name: A lane that cannot serve must chain, and no notice may take the firm offline
        run: npm run validate:chaining

      # Migrations 0187 and 0188. Three of these seven cannot be written as a test.
      #
      # The heartbeat interval lives in TypeScript in the Worker AND in JavaScript on a laptop; a
      # claimer that pings less often than the freshness window is permanently invisible and nothing
      # anywhere says why, which looks exactly like a machine that is always asleep. The launchd
      # label and log paths must stay distinct from Boss OS's, or `launchctl unload` on one silently
      # stops the other. And a claimable lane costs $0 while NOT permitting training, so the filter
      # that keeps the free lanes out of ordinary selection does not catch it — drop the `claimable`
      # clause and every unpinned call in the firm routes to the owner's own laptop on the strength
      # of a zero.
      - name: Two seats she already pays for, and one ladder walked down
        run: npm run validate:seats

      # Migration 0189. `DELIVERABLE_KINDS` has offered `approval_preview` since 0183 built the
      # preview lane; the CHECK on `deliverable.kind` was never widened to match, so production
      # refused the one row the feature exists to write and nothing said so — previews arrive by
      # email, and only the archived copy goes through `deliverable`. The single symptom was
      # `validate:value-shapes` going red, and that one is deliberately outside CI because it needs
      # production credentials. A list in TypeScript and a list in SQL with no link between them.
      - name: A kind the code can produce is a kind the database accepts
        run: npm run validate:deliverable-kinds

      # Migration 0192. The one line the owner reads first said "NORMAL/FRONTIER · 2 blocked run(s)"
      # on a morning the router was in fact economising. `cost_mode` is DERIVED from the spend lever
      # by runAi and never read back, and `privacy_mode` is about privacy — neither is a posture.
      # And the blocked count was a hand-typed list of five statuses that omitted PREFLIGHT_BLOCKED,
      # which is the status of every named stop the spend lever raises: a run her own lever had
      # stopped was invisible on the page she reads first, while the Cockpit counted it. Two screens,
      # one word, two populations. This reads the CHECK constraint out of the migration.
      - name: What stopped is counted once, and the posture on screen is the one that routes
        run: npm run validate:stopped-runs

      # Migration 0192. Two provider deadlines in two days were chosen by matching a sentence —
      # 60s as "comfortably above a long frontier completion", then 180s to match a comment reading
      # "~3 min" — and both were too short. The owner named the flaw before anyone measured: a
      # deadline set equal to the expected duration fails half the calls by construction. The
      # production sample now lives in chainBudget.ts as data, every constant is checked against it,
      # and the whole chain is bounded so that generous per-rung deadlines cannot add up to a
      # morning of apparent silence.
      - name: A run may not spend the morning discovering that nothing answered
        run: npm run validate:chain-budget

      # A GREEN RUN HAS TO MEAN SOMETHING. On 18 Sep 2026 the Playwright step was
      # `npm run e2e || (… && npm run e2e)`: a shell `||` that could not tell a `workerd` crash from
      # a wrong assertion, so every intermittent failure in the suite got a free second attempt and
      # the check reported green. Eleven pull requests merged that day on the strength of it, while
      # the suite was failing 2 runs in 5 on untouched main. Nothing failed when that line was
      # added, which is the whole reason this validator exists — it fails if anything in the repo
      # can make a red journey look green, and it hard-fails if it examines no specs at all.
      - name: A green run means something
        run: npm run validate:green-means-something

      # EVERY COMPANY IS IN THE PIPELINE, 18 Sep 2026. Owner: "all companies should be in the
      # pipeline, no matter how they come in. They are top of funnel if they are in the system."
      # Northwind Robotics and Vynlo sat in the register for a month with no opportunity because one
      # route of four wrote the pipeline and a work card was trusted to do the rest. This fails if
      # the route table grows a switch again, if the door can return without an opportunity, if the
      # exactly-one-per-route pin is deleted or misses a route, if the Companies page goes back to
      # calling a deal-less company "Not in the pipeline", or if the backfill's shape drifts.
      - name: Every company is in the pipeline
        run: npm run validate:companies-in-pipeline

      # THE WEEKLY REVIEW IS ARCHIVED, 18 Sep 2026. Owner: "we don't need it anymore." The job is
      # RETIRED, the nav item is gone, the route still answers a bookmark, every row is kept. This
      # fails if any migration or seed after 0198 puts `weekly_mp_review` back to ACTIVE or PAUSED,
      # if the nav lists it again, if the dispatcher can still reach the generator from the tick, or
      # if the finished-work shelf surfaces the archived kind by default.
      - name: An archived lane stays archived
        run: npm run validate:weekly-review-archived

      # 18 Sep 2026: `validate:css-classes` failed a correct branch because a comment explained that
      # the class it named had just been removed. 25 of 40 scans stripped comments, 12 did not. The
      # gate costs ~8 seconds in total, so the tax was never the number of validators — it was that
      # a third of them could be fooled by a sentence, and a rule people route around is worse than
      # no rule at all.
      - name: A scan reads code, not prose
        run: npm run validate:scans-read-code

      - name: Build client
        run: npm run build

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    # Two full passes of the suite plus the browser install; the old single pass plus its retry
    # already fitted in 30, and a timeout that trips is a red run nobody can read.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      # `--with-deps` runs `apt-get update`, which on a GitHub runner consults Google's own Chrome
      # apt repository — a third-party source this job does not need and does not use. On 9 Sep 2026
      # that repository served a corrupt index and `apt` failed the whole step twice in a row with
      # "Hash Sum mismatch ... dl.google.com/linux/chrome-stable", before a single journey ran.
      #
      # Playwright ships its OWN Chromium build; `--with-deps` only wants shared libraries, and
      # those come from Ubuntu's repositories. So the fix is to stop apt consulting a source that
      # has nothing to do with this build, rather than to tolerate the failure.
      #
      # THIS IS NOT A WEAKENED GATE, and the distinction matters. There is no `continue-on-error`
      # here, no `if: always()`, and nothing skipped: if the browser install genuinely fails, this
      # step still fails and the job still fails. What changes is that an unrelated vendor's package
      # index can no longer decide whether West Peek's journeys are allowed to run.
      # Matched on CONTENT, not on a filename. The first attempt removed
      # `google-chrome.list` by name and apt kept failing on the same URL, because the runner image
      # declares the source somewhere else — a deb822 `.sources` file, or a differently named list.
      # Grepping for the host finds it whatever it is called, and the step PRINTS what it removed so
      # a silent no-op cannot masquerade as a fix.
      - name: Remove the third-party apt source this job does not use
        run: |
          set -euo pipefail
          found=$(sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Removing apt sources that point at dl.google.com:"
            echo "$found"
            echo "$found" | xargs -r sudo rm -f
          else
            echo "No apt source referencing dl.google.com is present; nothing to remove."
          fi
          # Ubuntu's own repositories are untouched and still have to work.
          sudo apt-get update

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `npm run e2e` resets the local D1 and starts its own `wrangler dev --local` — offline,
      # no credentials, safe to re-run back to back (AGENTS.md: "that is a hard requirement, not
      # a nicety").
      #
      # THIS STEP USED TO BE `npm run e2e || (… && npm run e2e)`, AND THAT IS WHAT MADE A GREEN
      # RUN WORTHLESS. The comment on it said the retry was for `wrangler dev` crashing and never
      # for a failing assertion. A shell `||` cannot tell those apart — it retries on ANY non-zero
      # exit. Measured on untouched origin/main on 18 Sep 2026, the suite failed 2 runs in 5; behind
      # that `||` it reported green nearly nine times in ten, and the tenth got dismissed as
      # "probably the flake". Eleven pull requests merged that day on the strength of this check.
      #
      # SO THE MEANING IS INVERTED, at the same wall clock the old retry already spent on a red run.
      # The suite runs TWICE, each from a freshly reset database, and BOTH have to pass. One green
      # run says almost nothing about a one-in-three failure; two independent clean runs is a claim
      # worth reading. `&&` short-circuits, so a first-run failure still fails immediately.
      #
      # THE `workerd` CRASH THE OLD RETRY EXISTED FOR IS STILL HANDLED, and now only it. Observed
      # twice on GitHub's Linux runners, never on macOS: an internal, message-less error ("please
      # create an issue at workers-sdk") that drops the server and takes every later test down with
      # ECONNREFUSED. The step below re-runs ONLY when that signature is in the output — matched on
      # the crash, not on the exit code — so a journey that fails on its own merits fails the job,
      # which is what the old comment claimed and the old code did not do.
      #
      # `npm run e2e` is deliberately named twice below rather than looped: `validate:green-means-
      # something` counts the invocations in this job and hard-fails if the suite is run only once.
      - name: Playwright journeys — twice, from a clean database, both must pass
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/e2e-1.log"
          if ! npm run e2e 2>&1 | tee "$log"; then
            if grep -qiE 'please create an issue at .*workers-sdk|internal error.*workerd' "$log"; then
              echo "::warning::wrangler dev crashed (workerd internal error) — re-running the first pass"
              npm run e2e
            else
              echo "::error::A journey failed on its own merits. This is NOT retried."
              exit 1
            fi
          fi
          npm run e2e

# West Peek OS — continuous validation.
#
# Runs the repo's real gate (typecheck, unit/integration tests, every static validator, the
# client build, and the Playwright journeys) on every push and pull request against `main`.
#
# Deliberately NOT in this workflow: a deploy step. BACKLOG.md records the decision already made
# here — Cloudflare Workers Builds was connected on 14 Aug 2026 and switched off on 18 Aug 2026,
# on purpose, because auto-deploy-on-push cannot run the safe migrate-then-deploy sequence
# (`npm run deploy:production`) without a long-lived Cloudflare API token with D1 write access
# living in the CI environment — real blast radius, for a firm that deploys from one laptop.
# GitHub is source history and a validation gate. It is not the deploy mechanism.
#
# Also NOT here: `validate:value-shapes`. It queries production D1 directly
# (`wrangler d1 execute --remote`) and needs the same production credentials this workflow
# deliberately does not hold. It stays a pre-deploy, operator-run check (docs/DEPLOYING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and boundary validators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npx vitest run --no-file-parallelism

      # The governance boundary scans are part of the gate, not optional extras: they are what
      # keep authority, the AI boundary, cross-repo isolation, brand, design tokens, CSS
      # coverage, and SQL-against-schema honest. Each has its own self-test — a validator that
      # cannot demonstrate it still catches what it exists to catch does not run here.
      - name: Authority boundary
        run: npm run validate:authority

      - name: AI boundary
        run: npm run validate:ai-boundary

      - name: Network boundary
        run: npm run validate:network-boundary

      - name: Brand system
        run: npm run validate:brand

      - name: Design tokens
        run: npm run validate:design-tokens

      - name: CSS class coverage
        run: npm run validate:css-classes

      - name: Every var(--token) resolves
        run: npm run validate:css-variables

      - name: SQL against schema
        run: npm run validate:sql

      # The LP deck cannot become current without a human deciding. On 9 Sep 2026 an upload
      # published itself and displaced the deck the firm sends; migration 0155 is the cleanup.
      - name: A deck becomes current only by human decision
        run: npm run validate:deck-decision

      # A West Peek employee signs from joinwestpeek.com — never from westpeek.ventures, which is
      # the LP-facing partner identity, and never from sequoiataylor.com, which is Boss OS.
      - name: Employees send from West Peek's own domain
        run: npm run validate:employee-sender

      - name: Build client
        run: npm run build

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      # `--with-deps` runs `apt-get update`, which on a GitHub runner consults Google's own Chrome
      # apt repository — a third-party source this job does not need and does not use. On 9 Sep 2026
      # that repository served a corrupt index and `apt` failed the whole step twice in a row with
      # "Hash Sum mismatch ... dl.google.com/linux/chrome-stable", before a single journey ran.
      #
      # Playwright ships its OWN Chromium build; `--with-deps` only wants shared libraries, and
      # those come from Ubuntu's repositories. So the fix is to stop apt consulting a source that
      # has nothing to do with this build, rather than to tolerate the failure.
      #
      # THIS IS NOT A WEAKENED GATE, and the distinction matters. There is no `continue-on-error`
      # here, no `if: always()`, and nothing skipped: if the browser install genuinely fails, this
      # step still fails and the job still fails. What changes is that an unrelated vendor's package
      # index can no longer decide whether West Peek's journeys are allowed to run.
      # Matched on CONTENT, not on a filename. The first attempt removed
      # `google-chrome.list` by name and apt kept failing on the same URL, because the runner image
      # declares the source somewhere else — a deb822 `.sources` file, or a differently named list.
      # Grepping for the host finds it whatever it is called, and the step PRINTS what it removed so
      # a silent no-op cannot masquerade as a fix.
      - name: Remove the third-party apt source this job does not use
        run: |
          set -euo pipefail
          found=$(sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Removing apt sources that point at dl.google.com:"
            echo "$found"
            echo "$found" | xargs -r sudo rm -f
          else
            echo "No apt source referencing dl.google.com is present; nothing to remove."
          fi
          # Ubuntu's own repositories are untouched and still have to work.
          sudo apt-get update

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `npm run e2e` resets the local D1 and starts its own `wrangler dev --local` — offline,
      # no credentials, safe to re-run back to back (AGENTS.md: "that is a hard requirement, not
      # a nicety"). The retry here is for `wrangler dev` itself, not for a failing assertion:
      # observed twice on GitHub's Linux runners, never on macOS — `workerd` throws an internal,
      # message-less error ("please create an issue at workers-sdk") and either drops the server
      # outright or serves a stretch of requests before dying later, taking down every test after
      # it with ECONNREFUSED. Neither occurrence traced to a real test failure once the retry ran
      # clean. A single retry re-runs the WHOLE command, which is what actually resets state
      # safely here — Playwright's own per-test retry would replay a test against a database a
      # crashed server already half-mutated, which is unsafe for this suite's single shared D1
      # (see playwright.config.ts). A journey that fails on its own merits fails the step: this
      # tolerates the tool crashing, never a wrong assertion.
      - name: Playwright journeys
        run: npm run e2e || (echo "::warning::wrangler dev crashed or a journey failed — retrying the whole suite once" && npm run e2e)
